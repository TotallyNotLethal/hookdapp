import groovy.xml.IndentPrinter
import groovy.xml.MarkupBuilder

plugins {
    id 'com.android.application'
}

apply from: '../variables.gradle'

def twaManifest = [
        applicationId              : 'fish.hookd.app',
        hostName                   : 'hookd.fish',
        launchUrl                  : '/',
        name                       : 'Hookd',
        launcherName               : 'Hookd',
        themeColor                 : '#38BDF8',
        themeColorDark             : '#0F172A',
        navigationColor            : '#000000',
        navigationColorDark        : '#000000',
        navigationDividerColor     : '#00000000',
        navigationDividerColorDark : '#00000000',
        backgroundColor            : '#0F172A',
        enableNotifications        : true,
        shortcuts                  : [],
        splashScreenFadeOutDuration: 300,
        generatorApp               : 'bubblewrap-cli',
        fallbackType               : 'customtabs',
        enableSiteSettingsShortcut : true,
        orientation                : 'default'
]

android {
    namespace "fish.hookd.app"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId twaManifest.applicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        resValue "string", "appName", twaManifest.name
        resValue "string", "launcherName", twaManifest.launcherName

        def launchUrl = "https://" + twaManifest.hostName + twaManifest.launchUrl
        resValue "string", "launchUrl", launchUrl
        resValue "string", "webManifestUrl", 'https://hookd.fish/manifest.json'
        resValue "string", "fullScopeUrl", 'https://hookd.fish/'
        resValue "string", "hostName", twaManifest.hostName

        resValue "color", "colorPrimary", twaManifest.themeColor
        resValue "color", "colorPrimaryDark", twaManifest.themeColorDark
        resValue "color", "navigationColor", twaManifest.navigationColor
        resValue "color", "navigationColorDark", twaManifest.navigationColorDark
        resValue "color", "navigationDividerColor", twaManifest.navigationDividerColor
        resValue "color", "navigationDividerColorDark", twaManifest.navigationDividerColorDark
        resValue "color", "backgroundColor", twaManifest.backgroundColor

        resValue "string", "providerAuthority", twaManifest.applicationId + '.fileprovider'
        resValue "bool", "enableNotification", twaManifest.enableNotifications.toString()
        resValue "integer", "splashScreenFadeOutDuration", twaManifest.splashScreenFadeOutDuration.toString()
        resValue "string", "generatorApp", twaManifest.generatorApp
        resValue "string", "fallbackType", twaManifest.fallbackType
        resValue "bool", "enableSiteSettingsShortcut", twaManifest.enableSiteSettingsShortcut.toString()
        resValue "string", "orientation", twaManifest.orientation
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

task generateShortcutsFile {
    assert twaManifest.shortcuts.size() < 5, "You can have at most 4 shortcuts."
    twaManifest.shortcuts.eachWithIndex { shortcut, index ->
        assert shortcut.name != null, 'Missing `name` in shortcut #' + index
        assert shortcut.short_name != null, 'Missing `short_name` in shortcut #' + index
        assert shortcut.url != null, 'Missing `url` in shortcut #' + index
        assert shortcut.icon != null, 'Missing `icon` in shortcut #' + index
    }

    def shortcutsFile = new File("$projectDir/src/main/res/xml", "shortcuts.xml")

    def xmlWriter = new StringWriter()
    def xmlMarkup = new MarkupBuilder(new IndentPrinter(xmlWriter, "    ", true))

    xmlMarkup.'shortcuts'('xmlns:android': 'http://schemas.android.com/apk/res/android') {
        twaManifest.shortcuts.eachWithIndex { shortcut, index ->
            'shortcut'('android:shortcutId': 'shortcut' + index,
                    'android:enabled': 'true',
                    'android:icon': '@drawable/' + shortcut.icon,
                    'android:shortcutShortLabel': '@string/shortcut_short_name_' + index,
                    'android:shortcutLongLabel': '@string/shortcut_name_' + index) {
                'intent'('android:action': 'android.intent.action.MAIN',
                        'android:targetPackage': twaManifest.applicationId,
                        'android:targetClass': twaManifest.applicationId + '.LauncherActivity',
                        'android:data': shortcut.url)
                'categories'('android:name': 'android.intent.category.LAUNCHER')
            }
        }
    }

    shortcutsFile.text = xmlWriter.toString() + '\n'
}

preBuild.dependsOn(generateShortcutsFile)

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.0'

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
