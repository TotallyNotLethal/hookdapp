# Project-wide Gradle settings.
# For details on how to configure your build environment visit
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM arguments used for the Gradle daemon.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC

# Enable AndroidX usage across the project.
android.useAndroidX=true

# Configure Kotlin code style for projects that add Kotlin modules later.
kotlin.code.style=official
